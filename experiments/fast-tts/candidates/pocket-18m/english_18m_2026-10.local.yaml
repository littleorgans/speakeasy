# Local copy of pocket_tts/config/english_18m_2026-10.yaml at pocket-tts 91a9e96433bfe23375eea719b03f0081466f8e20.
# Changes: weights_path selects the no cloning snapshot directly (upstream tries the gated cloning repo first),
# weights_path_without_voice_cloning removed, tokenizer_path local. render.py replaces MODELS_ROOT with --root.
# Snapshot: kyutai/pocket-tts-without-voice-cloning@a7056f505a4a8ca72d8b5fb1440071d6f1a35739 (tokenizer.model identical at 08ffc58775e62aad9409511b9591c9af626270f3).
# English model with 18.2M parameters: a 15.6M flow LM and a 2.6M decoder.

weights_path: MODELS_ROOT/pocket-tts-english-18m-2026-10-a7056f50/languages/english_18m_2026-10/model.safetensors
default_temperature: 0.3
# Replace characters that are absent from the training data.
replace_characters:
  '–': ','
  '—': ','
  '’': "'"
  '‘': "'"

flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 4
    dim: 192
    type: drifting
  transformer:
    d_model: 512
    hidden_scale: 1
    max_period: 10000
    num_heads: 8
    num_layers: 8
    attn_dim: null
    num_kv_heads: null
  lookup_table:
    dim: 512
    n_bins: 4000
    tokenizer: sentencepiece
    tokenizer_path: MODELS_ROOT/pocket-tts-english-18m-2026-10-a7056f50/languages/english_18m_2026-10/tokenizer.model
    rank: null
  z_dim: 64
mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 128
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 128
  decoder_seanet:
    dimension: 128
    channels: 1
    n_filters: 32
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 3
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  decoder_transformer:
    d_model: 128
    num_heads: 4
    num_layers: 12
    layer_scale: 0.01
    context: 50
    dim_feedforward: 384
    input_dimension: 128
    output_dimensions:
    - 128
default_eos_threshold: -1.0
