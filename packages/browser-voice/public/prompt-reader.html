<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11120f" />
    <title>Speak Easy · Prompt reader</title>
    <link rel="stylesheet" href="/prompt-reader.css" />
    <script src="/prompt-reader.js" type="module"></script>
  </head>
  <body data-state="loading">
    <header class="bar">
      <strong>Prompt reader</strong>
      <span id="progress" aria-live="polite">Loading prompts</span>
    </header>

    <main class="reader">
      <p class="meta" id="prompt-meta"></p>
      <p class="prompt" id="prompt-text"></p>
      <div class="heard" id="heard" hidden aria-live="polite">
        <p class="heard-text" id="heard-text"></p>
        <p class="heard-note" id="heard-note"></p>
        <p class="heard-note" id="heard-hotwords"></p>
        <p class="heard-error" id="heard-error"></p>
      </div>
      <meter id="level" min="0" max="0.5" value="0" aria-label="Microphone level"></meter>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="controls">
        <button id="record" type="button">Hold to record <kbd>Space</kbd></button>
        <button id="save" type="button" disabled>Save and next <kbd>Enter</kbd></button>
        <button id="play" type="button" disabled><span id="play-label">Play</span> <kbd>P</kbd></button>
        <button id="earlier" type="button" hidden>Earlier take <kbd>T</kbd></button>
        <button id="previous" type="button">Previous <kbd>←</kbd></button>
        <button id="next" type="button">Skip <kbd>→</kbd></button>
      </div>
      <section class="speech-input" aria-labelledby="speech-input-heading">
        <h2 id="speech-input-heading">Speech input</h2>
        <fieldset id="input-selection">
          <legend class="heard-note">Choose the next comparison</legend>
          <label class="input-field" for="input-provider">Speech input provider</label>
          <select id="input-provider"><option value="local">Local</option></select>
          <div id="input-local">
            <fieldset id="input-modes">
              <legend>Transcription mode</legend>
              <label><input type="radio" name="input-mode" value="compare" checked /> Compare setups</label>
              <label><input type="radio" name="input-mode" value="current-list" /> Current list</label>
            </fieldset>
            <div class="input-presets" id="input-presets"></div>
          </div>
          <label class="input-field" id="input-api" hidden>Transcription model <select id="input-model"></select></label>
        </fieldset>
        <p class="heard-note" id="input-transfer">Fixed presets. The editable known word list applies to Current list only.</p>
        <p class="heard-note" id="comparison-source"></p>
        <div class="controls">
          <button id="compare-take" type="button" disabled>Compare take</button>
          <button id="cancel-comparison" type="button" hidden>Cancel comparison</button>
        </div>
        <p class="heard-note" id="comparison-status" aria-live="polite">Loading setups</p>
        <div class="setup-results" id="comparison-results"></div>
      </section>
    </main>

    <footer class="bar">
      <span>Edit known words in</span>
      <code id="hotwords-path"></code>
      <span>Reloaded for every take. Empty or missing file uses no list.</span>
      <span>Takes save to</span>
      <code id="output"></code>
    </footer>
  </body>
</html>
